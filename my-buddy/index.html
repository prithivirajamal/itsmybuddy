<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Buddy</title>
<meta name="theme-color" content="#2742c9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1420" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Buddy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-width column, three tabs on a bottom bar (Home, EMIs, Loans), add-forms slide up as a sheet. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#14213d; --muted:#5b6b86; --line:#d9dfeb;
  --accent:#2742c9; --accent-ink:#ffffff; --soft:#e4e9f7;
  --good:#1a7f4b; --good-soft:#dff3e8; --warn:#9a6208; --warn-soft:#fbefd5; --bad:#c43d3d; --bad-soft:#fbe3e1;
  --f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1420; --surface:#161e2e; --ink:#e6ebf5; --muted:#9aa8c2; --line:#263147;
  --accent:#8fa2ff; --accent-ink:#0e1420; --soft:#1f2a45;
  --good:#4cc38a; --good-soft:#15302a; --warn:#e0b04a; --warn-soft:#33290f; --bad:#f0766f; --bad-soft:#3a1c1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1420; --surface:#161e2e; --ink:#e6ebf5; --muted:#9aa8c2; --line:#263147;
  --accent:#8fa2ff; --accent-ink:#0e1420; --soft:#1f2a45;
  --good:#4cc38a; --good-soft:#15302a; --warn:#e0b04a; --warn-soft:#33290f; --bad:#f0766f; --bad-soft:#3a1c1e; color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font:700 22px/1.1 var(--f-display);margin:0;letter-spacing:-.02em}
.status{font-size:12px;color:var(--muted)}
h2{font:700 13px/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero{background:var(--ink);color:var(--bg);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero .big{font:700 34px/1 var(--f-display);letter-spacing:-.02em}
.hero .lbl{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.08em}
.hero .row{display:flex;gap:20px;flex-wrap:wrap}
.hero .row>div{min-width:0;display:flex;flex-direction:column;gap:4px}
.hero .sm{font:600 18px/1.1 var(--f-num)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.amt{font:500 15px/1 var(--f-num);white-space:nowrap}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--soft);color:var(--accent);white-space:nowrap}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}
.empty{border:1px dashed var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.empty p{margin:0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;display:flex;gap:10px;justify-content:space-between;align-items:center;font-size:13px}
.plan{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.plan-top{display:flex;flex-direction:column;gap:10px;padding:14px;width:100%;text-align:left;background:none;border:0}
.plan-line{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.segs{display:flex;gap:3px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.segs i.on{background:var(--good)}
.insts{border-top:1px solid var(--line)}
.inst{display:flex;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:14px}
.inst:first-child{border-top:0}
.inst .d{flex:1;min-width:0}
.inst.paid .d{color:var(--muted)}
.plan-foot{display:flex;justify-content:flex-end;padding:8px 14px;border-top:1px solid var(--line)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
nav .in{display:flex;width:100%;max-width:560px;gap:6px}
nav button{flex:1;background:none;border:0;border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav button[aria-current="page"]{color:var(--accent);background:var(--soft)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.scrim{position:fixed;inset:0;background:rgba(10,15,28,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;max-height:92%;overflow-y:auto}
.sheet h3{font:700 18px/1.2 var(--f-display);margin:0}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted);background:var(--soft);border-radius:9px;padding:8px 10px}
.err{font-size:13px;color:var(--bad);min-height:1em}
.share{display:flex;flex-direction:column;gap:2px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.col{display:flex;flex-direction:column;gap:6px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.chk input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.inst{flex-wrap:wrap}
.inst .d{flex:1 1 150px;min-width:0}
.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;min-width:0;resize:vertical}
.mscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.mb{flex:none;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 12px;min-width:58px;border:1px solid var(--line);background:var(--surface);border-radius:10px;scroll-snap-align:start}
.mb b{font:700 14px/1.2 var(--f-display)}
.mb span{font-size:11px;color:var(--muted)}
.mb.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mb.on span{color:inherit;opacity:.75}
.mb .dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--good)}
.panel{display:flex;flex-direction:column;gap:12px}
.mt{font:700 18px/1.2 var(--f-display)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav aria-label="Sections"><div class="in" id="nav"></div></nav>
<div id="sheet-root"></div>

<script>
(function(){
"use strict";
var LS_KEY="my-buddy-v1";
var state={emis:[],loans:[],borrowed:[],chit:null};
var view="home", openPlan=null, loaded=false, loadNote="", localOnly=false;
var ledgerRef=null, ver=0, savedVer=0, timer=null, chain=Promise.resolve(), statusText="";
var delArm=null, editing=null, dateCtx=null, dueTouched=false;

/* ---------- dates & money ---------- */
function p2(n){return (n<10?"0":"")+n}
function iso(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function parse(s){var a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])}
function today(){return iso(new Date())}
function addMonths(s,n){var a=s.split("-").map(Number);var t=new Date(a[0],a[1]-1+n,1);
  var last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  return iso(new Date(t.getFullYear(),t.getMonth(),Math.min(a[2],last)))}
function monthEnd(){var d=new Date();return iso(new Date(d.getFullYear(),d.getMonth()+1,0))}
function fmtDate(s){var d=parse(s),y=new Date().getFullYear();
  return d.toLocaleDateString("en-IN",d.getFullYear()===y?{day:"numeric",month:"short"}:{day:"numeric",month:"short",year:"numeric"})}
function money(n){return "₹"+Math.round(n).toLocaleString("en-IN")}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/86400000)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}

/* ---------- model ---------- */
function dueOf(p,i){if(p.dues&&Object.prototype.hasOwnProperty.call(p.dues,i))return p.dues[i]||null;return p.noDue?null:addMonths(p.start,i)}
function insts(p){var out=[];for(var i=1;i<=p.months;i++){out.push({i:i,due:dueOf(p,i),paid:(p.paid&&p.paid[i])||null,amount:p.amount})}return out}
function dueChip(due){if(!due)return '<span class="chip">No due date</span>';var t=today(),d=daysBetween(t,due);
  if(d<0)return '<span class="chip bad">Overdue '+(-d)+'d</span>';
  if(d===0)return '<span class="chip warn">Due today</span>';
  return '<span class="chip">Due '+fmtDate(due)+'</span>'}
function sortDue(a,b){if(!a.due&&!b.due)return 0;if(!a.due)return 1;if(!b.due)return -1;return a.due<b.due?-1:a.due>b.due?1:0}
function emiLabel(p,i){return [p.card,p.item].filter(Boolean).join(" · ")+" · EMI "+i+" of "+p.months}
function dueItems(){var end=monthEnd(),out=[];
  state.emis.forEach(function(p){insts(p).forEach(function(x){if(!x.paid&&x.due&&x.due<=end)out.push({kind:"emi",id:p.id,i:x.i,friend:p.friend,label:emiLabel(p,x.i),amount:x.amount,due:x.due})})});
  state.loans.forEach(function(l){if(!l.returned&&l.due&&l.due<=end)out.push({kind:"loan",id:l.id,friend:l.friend,label:"Loan"+(l.note?" · "+l.note:""),amount:l.amount,due:l.due})});
  out.sort(sortDue);return out}
function payItems(){var end=monthEnd();return state.borrowed.filter(function(b){return !b.repaid&&b.due&&b.due<=end}).map(function(b){return {kind:"borrow",id:b.id,friend:b.friend,label:"You borrowed"+(b.note?" · "+b.note:""),amount:b.amount,due:b.due}}).sort(sortDue)}
function undatedItems(){var out=[];
  state.emis.forEach(function(p){var n=insts(p).filter(function(x){return !x.paid&&!x.due})[0];if(n)out.push({kind:"emi",id:p.id,i:n.i,friend:p.friend,label:emiLabel(p,n.i),amount:n.amount,due:null})});
  state.loans.forEach(function(l){if(!l.returned&&!l.due)out.push({kind:"loan",id:l.id,friend:l.friend,label:"Loan"+(l.note?" · "+l.note:""),amount:l.amount,due:null})});
  state.borrowed.forEach(function(b){if(!b.repaid&&!b.due)out.push({kind:"borrow",id:b.id,friend:b.friend,label:"You borrowed"+(b.note?" · "+b.note:""),amount:b.amount,due:null})});
  return out}
function homeRow(x,showDate){var b=x.kind==="emi"?["pay","Paid"]:x.kind==="loan"?["ret","Returned"]:["rep","Repaid"];
  return '<div class="item"><div class="main"><span class="t">'+esc(x.friend)+'</span><span class="s">'+esc(x.label)+'</span><span>'+dueChip(x.due)+'</span></div><span class="amt">'+money(x.amount)+'</span>'+
    '<div class="col"><button class="btn ok sm" data-a="'+b[0]+'" data-id="'+x.id+'" data-i="'+(x.i||"")+'">'+b[1]+'</button>'+
    (showDate?'<button class="btn sm" data-a="date" data-kind="'+x.kind+'" data-id="'+x.id+'" data-i="'+(x.i||"")+'">Set date</button>':'')+'</div></div>'}
function totals(){var emi=0,loan=0,owe=0,byFriend={};
  function add(f,k,v){var key=f.trim();byFriend[key]=byFriend[key]||{emi:0,loan:0,owe:0};byFriend[key][k]+=v}
  state.emis.forEach(function(p){insts(p).forEach(function(x){if(!x.paid){emi+=x.amount;add(p.friend,"emi",x.amount)}})});
  state.loans.forEach(function(l){if(!l.returned){loan+=l.amount;add(l.friend,"loan",l.amount)}});
  state.borrowed.forEach(function(b){if(!b.repaid){owe+=b.amount;add(b.friend,"owe",b.amount)}});
  return {emi:emi,loan:loan,owe:owe,byFriend:byFriend}}
function friends(){var s={};state.emis.concat(state.loans,state.borrowed).forEach(function(x){s[x.friend]=1});return Object.keys(s).sort()}
function cards(){var s={};state.emis.forEach(function(x){if(x.card)s[x.card]=1});return Object.keys(s).sort()}
function normalize(d){d=d||{};return {emis:Array.isArray(d.emis)?d.emis:[],loans:Array.isArray(d.loans)?d.loans:[],borrowed:Array.isArray(d.borrowed)?d.borrowed:[],chit:d.chit&&Array.isArray(d.chit.members)?d.chit:null}}

/* ---------- persistence ---------- */
function setStatus(t){statusText=t;var el=document.getElementById("status");if(el)el.textContent=t}
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}
function lsLoad(){try{var r=localStorage.getItem(LS_KEY);return r?normalize(JSON.parse(r)):null}catch(e){return null}}
function touch(){ver++;lsSave();setStatus(localOnly?"Saved on this phone":"Saving…");clearTimeout(timer);timer=setTimeout(flush,350);render()}
function flush(){
  if(!ledgerRef){setStatus("Saved on this phone");savedVer=ver;return}
  var snap=JSON.parse(JSON.stringify(state)),v=ver;
  chain=chain.then(function(){return ledgerRef.set(snap)}).then(function(){
    if(v>savedVer)savedVer=v;
    if(savedVer===ver)setStatus("Saved")
  }).catch(function(){setStatus("Could not save. Check your connection.")})}

/* ---------- actions ---------- */
function find(list,id){for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i]}
function togglePaid(planId,i){var p=find(state.emis,planId);if(!p)return;p.paid=p.paid||{};
  if(p.paid[i])delete p.paid[i];else p.paid[i]=today();touch()}
function toggleLoan(id){var l=find(state.loans,id);if(!l)return;
  if(l.returned){l.returned=null}else{l.returned=today()}touch()}
function toggleBorrow(id){var b=find(state.borrowed,id);if(!b)return;if(b.repaid){b.repaid=null}else{b.repaid=today()}touch()}
function removeItem(kind,id){if(kind==="chit"){state.chit=null;chitMonth=null;touch();return}
  var list=kind==="emi"?state.emis:kind==="borrow"?state.borrowed:state.loans;
  for(var i=0;i<list.length;i++)if(list[i].id===id){list.splice(i,1);break}
  if(openPlan===id)openPlan=null;touch()}
function loadExamples(){var t=today();
  state.emis.push({id:uid(),ex:1,friend:"Arun",card:"HDFC Regalia",item:"Phone, Amazon",amount:4200,months:6,start:addMonths(t,-2),paid:{1:addMonths(t,-1)}});
  state.emis.push({id:uid(),ex:1,friend:"Meena",card:"SBI Card",item:"Laptop, Flipkart",amount:5800,months:9,start:addMonths(t,-1),paid:{}});
  state.loans.push({id:uid(),ex:1,friend:"Karthik",amount:8000,date:addMonths(t,-1),due:t,note:"",returned:null});
  state.loans.push({id:uid(),ex:1,friend:"Arun",amount:3000,date:t,due:addMonths(t,1),note:"Rent gap",returned:null});
  state.borrowed.push({id:uid(),ex:1,friend:"Suresh",amount:10000,date:addMonths(t,-1),due:addMonths(t,1),note:"Bike repair",repaid:null});
  touch()}
function clearExamples(){state.emis=state.emis.filter(function(x){return !x.ex});state.loans=state.loans.filter(function(x){return !x.ex});state.borrowed=state.borrowed.filter(function(x){return !x.ex});touch()}

/* ---------- rendering ---------- */
function hasExamples(){return state.emis.some(function(x){return x.ex})||state.loans.some(function(x){return x.ex})||state.borrowed.some(function(x){return x.ex})}
function nameList(id,arr){return '<datalist id="'+id+'">'+arr.map(function(f){return '<option value="'+esc(f)+'">'}).join("")+'</datalist>'}

function renderHome(){
  var h="",d=dueItems(),t=totals(),empty=!state.emis.length&&!state.loans.length&&!state.borrowed.length&&!state.chit;
  if(empty){
    return '<div class="empty"><h2>Nothing tracked yet</h2><p>Add a card EMI and the app lists every monthly payment for you. Add a loan and it reminds you when it is due back.</p>'+
      '<div class="actions"><button class="btn pri" data-a="new-emi">Add card EMI</button><button class="btn" data-a="new-loan">Add loan</button><button class="btn" data-a="new-borrow">Add borrowed</button></div>'+
      '<button class="link" data-a="examples" style="align-self:flex-start">Try it with example entries</button></div>'}
  var dueTotal=d.reduce(function(s,x){return s+x.amount},0);
  h+='<div class="hero"><div><div class="lbl">To collect by month end</div><div class="big num">'+money(dueTotal)+'</div></div>'+
    '<div class="row"><div><span class="lbl">EMIs left</span><span class="sm">'+money(t.emi)+'</span></div><div><span class="lbl">Loans out</span><span class="sm">'+money(t.loan)+'</span></div><div><span class="lbl">You owe</span><span class="sm">'+money(t.owe)+'</span></div></div></div>';
  h+='<section class="sec"><div class="sec-head"><h2>Due this month</h2></div>';
  if(!d.length)h+='<div class="empty"><p>All clear. Nothing is due before the end of this month.</p></div>';
  else h+='<div class="list">'+d.map(function(x){return homeRow(x,false)}).join("")+'</div>';
  h+='</section>';
  var pay=payItems();
  if(pay.length)h+='<section class="sec"><div class="sec-head"><h2>You pay this month</h2></div><div class="list">'+pay.map(function(x){return homeRow(x,false)}).join("")+'</div></section>';
  var und=undatedItems();
  if(und.length)h+='<section class="sec"><div class="sec-head"><h2>No due date yet</h2></div><div class="list">'+und.map(function(x){return homeRow(x,true)}).join("")+'</div></section>';
  if(state.chit){var c=state.chit,cm=ccur(c),ms=cmonthStats(c,cm);
    h+='<section class="sec"><div class="sec-head"><h2>Chit fund</h2></div><div class="list"><div class="item"><div class="main"><span class="t">'+esc(c.name||"Chit fund")+' \u00B7 Month '+cm+' of '+c.members.length+'</span><span class="s">'+(ms.w?"Winner: "+esc(ms.w.name):"No winner yet")+' \u00B7 '+(ms.left>0?money(ms.left)+" left to collect":"All collected")+'</span></div><button class="btn sm" data-a="tab" data-v="chit">Open</button></div></div></section>'}
  var names=Object.keys(t.byFriend).sort();
  if(names.length){h+='<section class="sec"><div class="sec-head"><h2>Net with each friend</h2></div><div class="list">';

/* ---------- chit fund ---------- */
var chitMonth=null, chitCtx=null;
function cmember(c,id){for(var i=0;i<c.members.length;i++)if(c.members[i].id===id)return c.members[i];return null}
function cdate(c,m){return addMonths(c.start,m-1)}
function mshort(sd){return parse(sd).toLocaleDateString("en-IN",{month:"short"})}
function ccur(c){var t=today(),cur=1;for(var m=1;m<=c.members.length;m++){if(cdate(c,m)<=t)cur=m}return cur}
function cpot(c){return c.monthly*c.members.length}
function ccell(c,m,id){var x=c.pay&&c.pay[m+"_"+id];return {p:(x&&x.p)||0,c:(x&&x.c)||0}}
function cwinner(c,m){var id=c.winners&&c.winners[m];return id?cmember(c,id):null}
function cwonMonth(c,id){var w=c.winners||{};for(var k in w)if(w[k]===id)return parseInt(k,10);return 0}
function ccoverBefore(c,id,m){var s=0;for(var k=1;k<m;k++)s+=ccell(c,k,id).c;return s}
function cpayout(c,m){var w=cwinner(c,m);if(!w)return null;var rec=(c.payouts&&c.payouts[m])||{},cover=ccoverBefore(c,w.id,m),adj=rec.adj||0;
  return {w:w,pot:cpot(c),own:c.monthly,cover:cover,adj:adj,net:cpot(c)-c.monthly-cover-adj,paidOn:rec.paidOn||null}}
function cmonthStats(c,m){var w=cwinner(c,m),col=0,exp=0,pend=0;
  c.members.forEach(function(x){if(w&&x.id===w.id)return;var cl=ccell(c,m,x.id);exp+=c.monthly;col+=cl.p+cl.c;if(cl.p+cl.c<c.monthly)pend++});
  return {exp:exp,col:col,left:Math.max(0,exp-col),pend:pend,w:w}}
function crow(label,amt,strong){return '<div class="item"><div class="main"><span class="'+(strong?"t":"s")+'">'+label+'</span></div><span class="amt"'+(strong?' style="font-weight:600"':'')+'>'+amt+'</span></div>'}

function renderChit(){

  var N=c.members.length,cur=ccur(c);if(!chitMonth||chitMonth>N)chitMonth=cur;
  var m=chitMonth,st=cmonthStats(c,m),po=cpayout(c,m),d=cdate(c,m),won=Object.keys(c.winners||{}).length,h="";
  h+='<div class="sec-head"><h2>'+esc(c.name||"Chit fund")+'</h2><button class="btn sm" data-a="chit-setup">Edit fund</button></div>';
  h+='<div class="hero"><div><div class="lbl">Month '+cur+' of '+N+' · pot each month</div><div class="big num">'+money(cpot(c))+'</div></div>'+
    '<div class="row"><div><span class="lbl">'+N+' members</span><span class="sm">'+money(c.monthly)+' each</span></div><div><span class="lbl">Winners so far</span><span class="sm">'+won+' of '+N+'</span></div></div></div>';

  h+='</div>';
  var tag=m<cur?["Past",""]:m===cur?["This month","warn"]:["Upcoming",""];
  h+='<div class="panel"><div class="plan-line" style="align-items:center"><div><div class="mt">Month '+m+'</div><div class="s" style="color:var(--muted);font-size:13px">'+fmtDate(d)+'</div></div><span class="chip '+tag[1]+'">'+tag[0]+'</span></div>';
  if(st.w){
    h+='<div class="list"><div class="item"><div class="main"><span class="s">Winner</span><span class="t">'+esc(st.w.name)+(st.w.host?" (you)":"")+'</span><span class="s">'+(c.hostMonth===m&&st.w.host?"Host's month, set in advance":"Gets the pot minus their own contribution")+'</span></div><button class="btn sm" data-a="cwin" data-m="'+m+'">Change</button></div></div>';
    h+='<div class="list">'+crow("Pot for the month",money(po.pot))+crow("Less: their contribution this month","− "+money(po.own))+
      (po.cover?crow("Less: you covered earlier","− "+money(po.cover)):"")+(po.adj?crow("Less: other adjustment","− "+money(po.adj)):"")+
      '<div class="item"><div class="main"><span class="t">'+(st.w.host?"Your payout":"Pay "+esc(st.w.name))+'</span>'+(po.paidOn?'<span class="chip good" style="align-self:flex-start">Given '+fmtDate(po.paidOn)+'</span>':"")+'</div><span class="amt" style="font-weight:600;font-size:17px">'+money(po.net)+'</span></div>'+
      '<div class="item"><div class="actions"><button class="btn sm" data-a="cadj" data-m="'+m+'">Adjust</button><button class="btn sm '+(po.paidOn?"":"ok")+'" data-a="cpayout" data-m="'+m+'">'+(po.paidOn?"Undo payout":"Mark payout given")+'</button></div></div></div>'}
  else h+='<div class="empty"><p>No winner yet for this month.</p><div class="actions"><button class="btn pri" data-a="cwin" data-m="'+m+'">Draw or choose winner</button></div></div>';
  h+='<div class="sec-head"><h2>Contributions</h2><span class="s" style="font-size:13px;color:var(--muted)">'+money(st.col)+' of '+money(st.exp)+(st.pend?" · "+st.pend+" to pay":"")+'</span></div><div class="list">';
  c.members.forEach(function(x){if(st.w&&x.id===st.w.id)return;
    var cl=ccell(c,m,x.id),tot=cl.p+cl.c,full=tot>=c.monthly,past=d<today(),chip,sub="";
    if(full)chip='<span class="chip good">Paid</span>';else if(tot>0)chip='<span class="chip warn">'+money(tot)+" of "+money(c.monthly)+'</span>';else chip=past?'<span class="chip bad">Overdue</span>':'<span class="chip">Due</span>';
    if(cl.c>0)sub="Member "+money(cl.p)+" · You covered "+money(cl.c);else if(cl.p>0)sub="Paid "+money(cl.p);
    var wm=cwonMonth(c,x.id);if(wm&&wm<m)sub+=(sub?" · ":"")+"Won month "+wm;
    h+='<div class="item"><div class="main"><span class="t">'+esc(x.name)+(x.host?" (you)":"")+'</span>'+(sub?'<span class="s">'+sub+'</span>':"")+'<span>'+chip+'</span></div><div class="col">'+
      (full?"":'<button class="btn ok sm" data-a="cpay" data-m="'+m+'" data-id="'+x.id+'">Paid</button>')+'<button class="btn sm" data-a="cedit" data-m="'+m+'" data-id="'+x.id+'">Edit</button></div></div>'});
  h+='</div></div>';
  h+='<section class="sec"><div class="sec-head"><h2>Members</h2></div><div class="list">'+c.members.map(function(x){
    var wm=cwonMonth(c,x.id),cov=0;for(var k2=1;k2<=N;k2++)cov+=ccell(c,k2,x.id).c;
    var rec=wm&&c.payouts&&c.payouts[wm]&&c.payouts[wm].paidOn?ccoverBefore(c,x.id,wm):0,owed=cov-rec;
    return '<div class="item"><div class="main"><span class="t">'+esc(x.name)+(x.host?" (you)":"")+'</span><span class="s">'+(wm?"Won month "+wm:"Not won yet")+(owed>0?" · You covered "+money(owed)+" so far":"")+'</span></div>'+(wm?'<span class="chip good">M'+wm+'</span>':"")+'</div>'}).join("")+'</div></section>';
  h+='<div class="actions" style="justify-content:flex-end"><button class="btn sm danger" data-a="del" data-kind="chit" data-id="chit">'+(delArm==="chit"?"Tap again to delete the fund":"Delete chit fund")+'</button></div>';
  return h}

/* chit sheets and actions */
function ta(id,label,rows,ph,v){return '<div class="fld"><label for="'+id+'">'+label+'</label><textarea id="'+id+'" rows="'+rows+'" placeholder="'+ph+'">'+esc(v)+'</textarea></div>'}
function openChitSheet(){var c=state.chit,e=!!c,t=today(),host=e?c.members.filter(function(x){return x.host})[0]:null;
  var others=e?c.members.filter(function(x){return !x.host}).map(function(x){return x.name}).join("\n"):"";
  document.getElementById("sheet-root").innerHTML='<div class="scrim" data-a="scrim"><form class="sheet" id="chit-form" novalidate>'+
    '<h3>'+(e?"Edit chit fund":"Set up chit fund")+'</h3>'+
    fld("f-cname","Fund name (optional)",'autocomplete="off" placeholder="Monthly chit" value="'+esc(e?c.name||"":"")+'"')+
    '<div class="two">'+fld("f-cmonthly","Monthly contribution (₹)",'type="number" inputmode="decimal" min="1" value="'+(e?c.monthly:10000)+'"')+fld("f-cstart","Month 1 date",'type="date" value="'+(e?c.start:t)+'"')+'</div>'+
    fld("f-chost","Your name (host)",'autocomplete="off" value="'+esc(host?host.name:"Me")+'"')+
    ta("f-cothers","Other members, one name per line",7,"Name 1&#10;Name 2&#10;Name 3",others)+
    (e?"":fld("f-chostm","Month the host wins by default (0 for none)",'type="number" inputmode="numeric" min="0" max="60" value="2"'))+
    '<div class="hint">'+(e?"Keep the same number of members. Renaming changes the name everywhere.":"Each member wins once, so the number of members is the number of months. You are counted as one member.")+'</div>'+
    '<div class="err" id="f-err" role="alert"></div>'+
    '<div class="actions" style="justify-content:flex-end"><button type="button" class="btn" data-a="close">Cancel</button><button type="submit" class="btn pri">'+(e?"Save changes":"Create fund")+'</button></div></form></div>';
  document.getElementById(e?"f-cname":"f-cothers").focus()}
function submitChit(){var name=val("f-cname"),mo=parseFloat(val("f-cmonthly")),st=val("f-cstart"),hn=val("f-chost")||"Me",err=document.getElementById("f-err"),
    lines=document.getElementById("f-cothers").value.split("\n").map(function(x){return x.trim()}).filter(Boolean);
  if(!(mo>0)){err.textContent="Enter the monthly contribution.";return}
  if(!st){err.textContent="Pick the date of month 1.";return}
  if(lines.length<1){err.textContent="Add at least one other member.";return}
  if(lines.length>59){err.textContent="That is too many members.";return}
  var c=state.chit;
  if(c){var others=c.members.filter(function(x){return !x.host});
    if(lines.length!==others.length){err.textContent="Keep the same number of members ("+others.length+"). You entered "+lines.length+".";return}
    c.name=name;c.monthly=mo;c.start=st;c.members.forEach(function(x){if(x.host)x.name=hn});others.forEach(function(x,i){x.name=lines[i]});closeSheet();touch();return}
  var members=[{id:uid(),name:hn,host:true}].concat(lines.map(function(n){return {id:uid(),name:n}}));
  c={name:name,monthly:mo,start:st,members:members,winners:{},pay:{},payouts:{},hostMonth:0};
  var hm=parseInt(val("f-chostm"),10);if(hm>=1&&hm<=members.length){c.winners[hm]=members[0].id;c.hostMonth=hm}
  state.chit=c;chitMonth=null;closeSheet();view="chit";location.hash="chit";touch()}
function openWinSheet(m){var c=state.chit;if(!c)return;chitCtx={m:m};var cur=c.winners&&c.winners[m];
  var elig=c.members.filter(function(x){var w=cwonMonth(c,x.id);return !w||w===m});
  document.getElementById("sheet-root").innerHTML='<div class="scrim" data-a="scrim"><div class="sheet"><h3>Winner for month '+m+'</h3>'+
    (elig.length?'<button class="btn pri" data-a="cdraw" data-m="'+m+'">Draw randomly</button><div class="hint">Only members who have not won yet are included.</div>'+
      elig.map(function(x){return '<button class="btn" style="text-align:left" data-a="setwin" data-m="'+m+'" data-id="'+x.id+'">'+esc(x.name)+(x.host?" (you)":"")+(cur===x.id?" · current winner":"")+'</button>'}).join(""):'<div class="hint">Every member has already won.</div>')+
    '<div class="actions" style="justify-content:space-between">'+(cur?'<button class="btn danger" data-a="unwin" data-m="'+m+'">Remove winner</button>':'<span></span>')+'<button class="btn" data-a="close">Close</button></div></div></div>'}
function setWinner(m,id){var c=state.chit;if(!c||!cmember(c,id))return;c.winners=c.winners||{};
  var prev=c.winners[m];if(prev&&prev!==id&&c.payouts)delete c.payouts[m];
  c.winners[m]=id;if(c.hostMonth===m&&!cmember(c,id).host)c.hostMonth=0;closeSheet();touch()}
function rnd(n){try{var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}catch(e){return Math.floor(Math.random()*n)}}
function drawWinner(m){var c=state.chit;if(!c)return;var elig=c.members.filter(function(x){var w=cwonMonth(c,x.id);return !w||w===m});
  if(!elig.length)return;setWinner(m,elig[rnd(elig.length)].id)}
function unsetWinner(m){var c=state.chit;if(!c)return;if(c.winners)delete c.winners[m];if(c.payouts)delete c.payouts[m];if(c.hostMonth===m)c.hostMonth=0;closeSheet();touch()}
function quickPay(m,id){var c=state.chit;if(!c)return;c.pay=c.pay||{};var cl=ccell(c,m,id);c.pay[m+"_"+id]={p:Math.max(0,c.monthly-cl.c),c:cl.c};touch()}
function openCellSheet(m,id){var c=state.chit,x=c&&cmember(c,id);if(!x)return;chitCtx={m:m,id:id};var cl=ccell(c,m,id);
  document.getElementById("sheet-root").innerHTML='<div class="scrim" data-a="scrim"><form class="sheet" id="cell-form" novalidate>'+
    '<h3>'+esc(x.name)+' · Month '+m+'</h3><div class="hint">Due this month: '+money(c.monthly)+'. If you pay part of it for them, enter that in the second box.</div>'+
    fld("f-cp","Paid by "+esc(x.name)+" (₹)",'type="number" inputmode="decimal" min="0" value="'+(cl.p||"")+'" placeholder="0"')+
    fld("f-cc","Covered by you (₹)",'type="number" inputmode="decimal" min="0" value="'+(cl.c||"")+'" placeholder="0"')+
    '<button type="button" class="btn sm" data-a="cfull" style="align-self:flex-start">Fill the rest as paid by them</button>'+
    '<div class="err" id="f-err" role="alert"></div>'+
    '<div class="actions" style="justify-content:flex-end"><button type="button" class="btn" data-a="close">Cancel</button><button type="submit" class="btn pri">Save</button></div></form></div>';
  document.getElementById("f-cp").focus()}
function submitCell(){var x=chitCtx,c=state.chit,err=document.getElementById("f-err");if(!x||!c)return;
  var p=parseFloat(val("f-cp"))||0,cv=parseFloat(val("f-cc"))||0;if(p<0||cv<0){err.textContent="Amounts cannot be negative.";return}
  c.pay=c.pay||{};var key=x.m+"_"+x.id;if(p===0&&cv===0)delete c.pay[key];else c.pay[key]={p:p,c:cv};closeSheet();touch()}
function openAdjSheet(m){var c=state.chit,po=c&&cpayout(c,m);if(!po)return;chitCtx={m:m};
  document.getElementById("sheet-root").innerHTML='<div class="scrim" data-a="scrim"><form class="sheet" id="adj-form" novalidate>'+
    '<h3>Adjust payout</h3><div class="hint">Use this for money you hold back, such as the next month’s shortfall you take in advance. It is subtracted from the payout.</div>'+
    fld("f-adj","Other adjustment (₹)",'type="number" inputmode="decimal" min="0" value="'+(po.adj||"")+'" placeholder="0"')+
    '<div class="err" id="f-err" role="alert"></div>'+
    '<div class="actions" style="justify-content:flex-end"><button type="button" class="btn" data-a="close">Cancel</button><button type="submit" class="btn pri">Save</button></div></form></div>';
  document.getElementById("f-adj").focus()}
function submitAdj(){var x=chitCtx,c=state.chit;if(!x||!c)return;var a=parseFloat(val("f-adj"))||0;
  if(a<0){document.getElementById("f-err").textContent="Enter zero or more.";return}
  c.payouts=c.payouts||{};var rec=c.payouts[x.m]||{};rec.adj=a;
  if(rec.paidOn){var po=cpayout(c,x.m);rec.amount=po?po.net:0}
  c.payouts[x.m]=rec;closeSheet();touch()}
function togglePayout(m){var c=state.chit;if(!c)return;c.payouts=c.payouts||{};var rec=c.payouts[m]||{};
  if(rec.paidOn){rec.paidOn=null;rec.amount=0}else{var po=cpayout(c,m);if(!po)return;rec.paidOn=today();rec.amount=po.net}
  c.payouts[m]=rec;touch()}

/* ---------- backup & restore ---------- */
function openBackupSheet(){var lb="";try{lb=localStorage.getItem(LS_KEY+"-bk")||""}catch(e){}
  document.getElementById("sheet-root").innerHTML='<div class="scrim" data-a="scrim"><div class="sheet"><h3>Backup &amp; restore</h3>'+
    '<div class="hint">Your entries are saved only on this phone. If you clear browser data or switch phones they are lost, so export a backup now and then.</div>'+
    '<div class="s" style="font-size:13px;color:var(--muted)">'+(lb?"Last backup: "+esc(fmtDate(lb)):"No backup made yet.")+'</div>'+
    '<div class="err" id="f-err" role="alert"></div>'+
    '<div class="actions"><button class="btn pri" data-a="export">Export backup</button><button class="btn" data-a="import">Import backup</button></div>'+
    '<input type="file" id="imp-file" accept=".json,application/json" hidden>'+
    '<div class="actions" style="justify-content:flex-end"><button class="btn" data-a="close">Close</button></div></div></div>'}
function exportData(){var blob=new Blob([JSON.stringify({app:"my-buddy",version:1,exported:new Date().toISOString(),data:state},null,2)],{type:"application/json"});
  var a=document.createElement("a"),u=URL.createObjectURL(blob);a.href=u;a.download="my-buddy-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(u)},3000);try{localStorage.setItem(LS_KEY+"-bk",today())}catch(e){}openBackupSheet()}
function importFile(f){var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result),n=normalize(j&&j.data?j.data:j);
    if(!n.emis.length&&!n.loans.length&&!n.borrowed.length&&!n.chit)throw 0;
    if(!confirm("Replace everything on this phone with this backup?"))return;state=n;closeSheet();touch()}
  catch(e){var er=document.getElementById("f-err");if(er)er.textContent="That file is not a valid My Buddy backup."}};r.readAsText(f)}
document.addEventListener("change",function(e){if(e.target.id==="imp-file"&&e.target.files[0])importFile(e.target.files[0])});

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");if(!el)return;var a=el.getAttribute("data-a"),id=el.getAttribute("data-id");
  if(a==="scrim"){if(e.target===el)closeSheet();return}
  if(a==="close"){closeSheet();return}
  if(a==="backup"){openBackupSheet();return}
  if(a==="export"){exportData();return}
  if(a==="import"){var fi=document.getElementById("imp-file");if(fi)fi.click();return}
  if(a==="tab"){view=el.getAttribute("data-v");location.hash=view;render();window.scrollTo(0,0);return}
  if(a==="new-emi"){openEmiSheet();return}
  if(a==="new-loan"){openLoanSheet();return}
  if(a==="new-borrow"){openBorrowSheet();return}
  if(a==="rep"){toggleBorrow(id);return}
  if(a==="examples"){loadExamples();return}
  if(a==="clear-ex"){clearExamples();return}
  if(a==="open"){openPlan=openPlan===id?null:id;render();return}
  if(a==="pay"){togglePaid(id,parseInt(el.getAttribute("data-i"),10));return}
  if(a==="ret"){toggleLoan(id);return}
  if(a==="edit"){var k=el.getAttribute("data-kind"),it=find(k==="emi"?state.emis:k==="borrow"?state.borrowed:state.loans,id);if(!it)return;
    if(k==="emi")openEmiSheet(it);else if(k==="borrow")openBorrowSheet(it);else openLoanSheet(it);return}
  if(a==="date"){openDateSheet(el.getAttribute("data-kind"),id,parseInt(el.getAttribute("data-i"),10));return}
  if(a==="cleardate"){saveDate(true);return}
  if(a==="chit-setup"){openChitSheet();return}
  if(a==="cm"){chitMonth=parseInt(el.getAttribute("data-m"),10);render();return}
  var cm_=parseInt(el.getAttribute("data-m"),10);
  if(a==="cwin"){openWinSheet(cm_);return}
  if(a==="setwin"){setWinner(cm_,id);return}
  if(a==="cdraw"){drawWinner(cm_);return}
  if(a==="unwin"){unsetWinner(cm_);return}
  if(a==="cpay"){quickPay(cm_,id);return}
  if(a==="cedit"){openCellSheet(cm_,id);return}
  if(a==="cfull"){var cc=state.chit,cv=parseFloat(val("f-cc"))||0;document.getElementById("f-cp").value=Math.max(0,cc.monthly-cv);return}
  if(a==="cpayout"){togglePayout(cm_);return}
  if(a==="cadj"){openAdjSheet(cm_);return}
  if(a==="del"){
    if(delArm===id){delArm=null;removeItem(el.getAttribute("data-kind"),id)}
    else{delArm=id;render();setTimeout(function(){if(delArm===id){delArm=null;render()}},3000)}}
});
document.addEventListener("submit",function(e){e.preventDefault();var i=e.target.id;
  if(i==="emi-form")submitEmi();else if(i==="loan-form")submitLoan();else if(i==="borrow-form")submitBorrow();else if(i==="date-form")saveDate(false);else if(i==="chit-form")submitChit();else if(i==="cell-form")submitCell();else if(i==="adj-form")submitAdj()});
document.addEventListener("input",function(e){var i=e.target.id;
  if(i==="f-date"||i==="f-months"||i==="f-nodue")emiHint();
  if(i==="f-due")dueTouched=true;
  if(i==="f-date"&&!editing&&!dueTouched&&document.getElementById("f-due")&&e.target.value)document.getElementById("f-due").value=addMonths(e.target.value,1)});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet()});
function readHash(){var h=location.hash.replace("#","");if(h==="emis"||h==="loans"||h==="borrowed"||h==="chit"||h==="home")view=h}
window.addEventListener("hashchange",function(){readHash();render()});
readHash();render();

/* ---------- boot ---------- */
localOnly=true;(function(){var s=lsLoad();if(s)state=s;loaded=true;setStatus("Saved on this phone");render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}})();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
</script>
</body>
